# Enable parallelism
junit.jupiter.execution.parallel.enabled=true

# Enable parallelism for both test methods and classes
junit.jupiter.execution.parallel.mode.default =  concurrent

#Dynamic strategy determines the number of threads  based on the number of processors/cores multiplied by factor parameter (defaults to 1)
junit.jupiter.execution.parallel.config.dynamic.factor = 2

#fixed strategy relies on a predefined number of threads
#junit.jupiter.execution.parallel.config.fixed.parallelism=3